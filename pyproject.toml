[project]
name = "ha-dreame-cloud"
version = "0.3.13"
description = "Dreame Cloud Vacuum integration for Home Assistant"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14.2"
dependencies = [
    "homeassistant>=2026.5.0",
    "dreame-mocker @ git+https://github.com/genericJE/dreame-mocker.git@v0.1.5",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["custom_components/dreame_cloud"]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "ruff>=0.11",
    "pytest-homeassistant-custom-component",
    "dreame-mocker[server] @ git+https://github.com/genericJE/dreame-mocker.git@v0.1.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["dev"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # trailing commas (conflicts with formatter)
    "D",        # docstring rules (not enforced yet)
    "ISC001",   # single-line implicit string concat (conflicts with formatter)
    "FBT",      # boolean trap (too noisy for HA service methods)
    "ANN401",   # disallow Any (unavoidable with HA/MIoT APIs)
    "ARG",      # unused arguments (HA callback signatures require them)
    "PLR0913",  # too many arguments (HA platform setup signatures)
    "PLR2004",  # magic values (unavoidable in protocol constants)
    "TRY003",   # long exception messages
    "EM",       # exception message style
    "TC",       # type-checking imports (breaks HA runtime imports)
    "PLC0415",  # import outside top-level (HA conditional imports)
    "C901",     # complexity (map rendering is inherently complex)
    "BLE001",   # blind except (needed for resilient map parsing)
    "PLR0911",  # too many return statements
    "PLR0912",  # too many branches
    "PLR0915",  # too many statements
    "PLR0917",  # too many positional arguments (HA platform/renderer signatures)
    "CPY001",   # copyright notice header (not used in this project)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",      # pytest asserts
    "S105",      # mock-cloud credentials
    "ASYNC240",  # small sync Path calls on test fixtures
]

[tool.ruff.lint.isort]
known-first-party = ["dreame_mocker"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["custom_components"]
# HA base classes mix property/cached_property — unfixable from integration side
reportIncompatibleVariableOverride = false
