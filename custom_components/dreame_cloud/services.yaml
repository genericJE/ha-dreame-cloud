clean_segment:
  name: Clean Segment
  description: Clean specific rooms/segments with custom settings.
  target:
    entity:
      integration: dreame_cloud
      domain: vacuum
  fields:
    segments:
      name: Segments
      description: List of room segment IDs to clean.
      required: true
      example: "[1, 2, 3]"
      selector:
        object:
    suction_level:
      name: Suction Level
      description: "Suction power: 0=Quiet, 1=Standard, 2=Strong, 3=Turbo."
      default: 1
      selector:
        number:
          min: 0
          max: 3
          mode: slider
    water_volume:
      name: Water Volume
      description: "Water flow: 1=Low, 2=Medium, 3=High."
      default: 2
      selector:
        number:
          min: 1
          max: 3
          mode: slider
    repeat:
      name: Repeat
      description: Number of cleaning passes.
      default: 1
      selector:
        number:
          min: 1
          max: 3
          mode: slider
    cleaning_mode:
      name: Cleaning Mode
      description: "Mode: 0=Sweeping, 1=Mopping, 2=Sweep & Mop."
      default: 2
      selector:
        number:
          min: 0
          max: 2
          mode: slider
